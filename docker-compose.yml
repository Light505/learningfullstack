services:
  web:
    image: ${WEB_IMAGE:-learningfullstack-web:local}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    deploy:
      replicas: 3
    healthcheck:
      test:
        - CMD-SHELL
        - 'php -r ''exit(@file_get_contents("http://127.0.0.1/") === false ? 1 : 0);'''
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
